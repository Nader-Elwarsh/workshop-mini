<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأجهزة</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a><div class="head"><h1>الأجهزة</h1><a class="btn" href="#deviceForm">+ جهاز جديد</a></div><form id="deviceForm" class="form"><input id="deviceId" type="hidden"><label>العميل<select id="deviceCustomer" required></select></label><label>العنوان المرتبط بالجهاز<select id="deviceAddress" required></select></label><div class="grid2"><label>نوع الجهاز<select id="deviceType" required></select></label><label>تصنيف الجهاز<select id="deviceSubtype" required></select></label></div><div class="grid2"><label>الماركة<select id="deviceBrand" required></select></label><label>الموديل<input id="deviceModel"></label></div><div class="grid2"><label>حالة الجهاز<select id="deviceCondition"><option>يعمل</option><option>متوقف</option><option>يعمل جزئيًا</option><option>لا يمكن الاختبار</option></select></label><label>وصف الجهاز<input id="deviceDescription" placeholder="اللون / السعة / ملاحظات تعريفية"></label></div><label>ملاحظات فنية للجهاز<textarea id="deviceNotes"></textarea></label><label>صور الجهاز<input id="devicePhoto" type="file" accept="image/*"></label><div id="photoPreview"></div><div class="actions"><button>حفظ وفتح ملف الجهاز 360°</button><button type="button" class="secondary hidden" id="cancelDevice">إلغاء التعديل</button></div></form><div class="filters"><input id="deviceSearch" placeholder="بحث بالعميل أو النوع أو الماركة أو الموديل"><select id="deviceFilter"><option value="">كل العملاء</option></select></div><div id="deviceList"></div></main><script src="app.js"></script></body></html>
