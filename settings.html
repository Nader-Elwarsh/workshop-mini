<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات النظام</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a><h1>⚙️ إعدادات النظام</h1>
<div class="settings-grid"><section class="panel" id="locations"><h2>📍 المراكز والقرى</h2><p class="hint">إضافة وتعديل وحذف المراكز والقرى من داخل النظام.</p><div class="inline"><input id="newCenter" placeholder="مركز جديد"><button onclick="addCenter()">➕</button></div><div id="centerSettings"></div></section>
<section class="panel" id="device-types"><h2>🔧 أنواع الأجهزة والتصنيفات</h2><div class="inline"><input id="newType" placeholder="نوع جهاز جديد"><button onclick="addType()">➕</button></div><div id="typeSettings"></div></section>
<section class="panel" id="brands"><h2>🏷️ الماركات</h2><div class="inline"><input id="newBrand" placeholder="ماركة جديدة"><button onclick="addBrand()">➕</button></div><div id="brandSettings"></div></section>
<section class="panel" id="part-categories"><h2>📦 تصنيفات المخزن</h2><div class="inline"><input id="newPartCategory" placeholder="تصنيف جديد"><button onclick="addPartCategory()">➕</button></div><div id="partCategorySettings"></div></section></div>
<p class="hint">يمكنك إضافة أو تعديل أو حذف القيم من هنا، وتظهر الاختيارات تلقائيًا في الوحدات المرتبطة.</p></main><script src="app.js"></script></body></html>
