<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العملاء</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a><div class="head"><h1>العملاء</h1><a class="btn" href="#customerForm">+ عميل جديد</a></div><form id="customerForm" class="form"><input id="customerId" type="hidden"><label>اسم العميل<input id="customerName" required></label><label>رقم التليفون<input id="customerPhone" required inputmode="tel"></label><div class="sectionbox"><h3>العنوان الأساسي</h3><div class="grid2"><label>المنطقة<select id="area" required><option value="">اختر المنطقة</option><option>مطاي</option><option>بني مزار</option></select></label><label>القرية في مطاي<select id="village"><option value="">اختر القرية</option></select></label></div><label>العنوان التفصيلي<input id="address" required placeholder="الشارع / رقم المنزل / علامة مميزة"></label></div><label>مواعيد العمل أو أنسب وقت للزيارة<input id="workTime" placeholder="مثال: بعد 5 مساءً"></label><div class="sectionbox"><h3>عناوين إضافية</h3><p class="hint">يمكن للعميل أكثر من عنوان، والجهاز وأمر الشغل يرتبطان بعنوان محدد.</p><div id="extraAddresses"></div><button type="button" class="secondary" id="addAddress">+ إضافة عنوان آخر</button></div><div class="actions"><button>حفظ وفتح ملف العميل 360°</button><button type="button" class="secondary hidden" id="cancelCustomer">إلغاء التعديل</button></div></form><div class="filters"><input id="customerSearch" placeholder="بحث بالاسم أو التليفون أو المنطقة أو القرية"><span class="hint">البحث يعمل فور الكتابة</span></div><div id="customerList"></div></main><script src="app.js"></script></body></html>
