<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العملاء</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a><div class="head"><h1>العملاء</h1><a class="btn" href="#customerForm">+ عميل جديد</a></div>
<form id="customerForm" class="form"><input id="customerId" type="hidden"><label>اسم العميل<input id="customerName" required></label><label>رقم التليفون<input id="customerPhone" required inputmode="tel"></label>
<div class="sectionbox"><h3>العنوان الأساسي</h3><div class="grid2"><label>المنطقة<select id="area" required><option value="">اختر</option><option>مطاي</option><option>بني مزار</option></select></label><div id="villageWrap"><label>القرية<select id="village"><option value="">اختر القرية</option><option>مطاي البلد</option><option>أبو عزيز</option><option>بردنوها</option><option>منبال</option></select></label></div></div><label>العنوان التفصيلي<input id="address" required></label></div>
<div class="sectionbox"><h3>عناوين إضافية</h3><p class="hint">تحسين معتمد: العميل يمكن أن يملك أكثر من عنوان، وكل جهاز يمكن ربطه بعنوان محدد.</p><div id="extraAddresses"></div><button type="button" class="secondary" id="addAddress">+ إضافة عنوان آخر</button></div>
<div class="actions"><button>حفظ وفتح ملف العميل 360°</button><button type="button" class="secondary hidden" id="cancelCustomer">إلغاء التعديل</button></div></form>
<input id="customerSearch" placeholder="بحث بالاسم أو التليفون"><div id="customerList"></div></main><script src="app.js"></script></body></html>
