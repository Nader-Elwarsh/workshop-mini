<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العملاء</title><link rel="stylesheet" href="style.css"></head><body><main class="page">
<a class="back" href="index.html">← الرئيسية</a><div class="page-head"><h1>العملاء</h1><a class="btn small" href="#customerForm">+ عميل جديد</a></div>
<form id="customerForm" class="form"><input type="hidden" id="customerId">
<label>اسم العميل<input id="customerName" required></label>
<label>رقم التليفون<input id="customerPhone" required inputmode="tel"></label>
<label>المنطقة<select id="area" required><option value="">اختر المنطقة</option><option>مطاي</option><option>بني مزار</option></select></label>
<div id="villageWrap" class="hidden"><label>القرية<select id="village"><option value="">اختر القرية</option><option>مطاي البلد</option><option>أبو عزيز</option><option>بردنوها</option><option>منبال</option></select></label></div>
<label>العنوان التفصيلي<input id="address" required></label>
<div class="actions"><button type="submit">حفظ وفتح ملف العميل 360°</button><button type="button" class="secondary hidden" id="cancelEdit">إلغاء التعديل</button></div>
</form>
<section><h2>قائمة العملاء</h2><input id="customerSearch" placeholder="بحث بالاسم أو التليفون"><div id="customerList"></div></section>
</main><script src="app.js"></script></body></html>
