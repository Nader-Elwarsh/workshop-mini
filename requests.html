<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001b4d"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png"><link rel="apple-touch-icon" href="icon-192-v2.png"><title>أوامر الشغل</title><link rel="stylesheet" href="style.css"><style>.request-folders{margin:10px 0 14px}.request-folders-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.request-folder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:inherit;background:#fff;border:1px solid #e2e6eb;border-radius:12px;padding:12px 8px;min-height:96px;box-shadow:0 1px 4px rgba(0,0,0,.04)}.request-folder span{font-size:24px}.request-folder b{font-size:13px}.request-folder small{color:#667085}.check-inline{display:flex;align-items:center;gap:6px}.check-inline input{width:auto}@media(max-width:700px){.request-folders-grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a>
<div class="page-head"><h1>🛠️ أوامر الشغل</h1><div class="section-actions"><button class="danger-btn small-btn" type="button" onclick="deleteAllRequests()">🗑️ حذف عام</button><button class="primary small-btn" onclick="toggle('requestForm')">➕ أمر شغل جديد</button></div></div><section id="requestFolders" class="request-folders"></section>
<form id="requestForm" class="form hidden"><div class="form-grid">
<label>العميل<div class="select-add"><select id="rCustomer" required></select><button type="button" class="secondary mini-action" onclick="toggle('quickCustomerBox')">➕ عميل</button></div></label><label>الجهاز<div class="select-add"><select id="rDevice" required></select><button type="button" class="secondary mini-action" onclick="toggle('quickDeviceBox')">➕ جهاز</button></div></label><label>العنوان<select id="rAddress" required></select></label><label>الأولوية<select id="rPriority"><option>عادية</option><option>عاجلة</option><option>أولوية عالية</option></select></label><label>موعد الزيارة<input id="rVisit" type="datetime-local"></label><label>مكان التنفيذ<select id="rExecutionPlace"><option>عند العميل</option><option>الورشة</option></select></label><label>حالة الورشة<select id="rWorkshopStatus"><option>غير مطلوب</option><option>مطلوب السحب</option><option>تم السحب</option><option>استلام الورشة</option><option>تحت الإصلاح</option><option>جاهز للتسليم</option><option>تم التسليم</option></select></label><label class="check-inline"><input id="rPartsWaiting" type="checkbox"> 📦 انتظار قطع غيار</label><label>الحالة<select id="rStatus"><option>جديد</option><option>تم التواصل</option><option>مجدول</option><option>جاري الفحص</option><option>انتظار موافقة العميل</option><option>تحت الإصلاح</option><option>مكتمل</option><option>ملغي</option></select></label>
<label class="wide">وصف العطل<textarea id="rFault" required></textarea></label><label class="wide">الكشف / الأعمال المنفذة<textarea id="rWork"></textarea></label></div>
<section class="calc"><h3>💰 الحساب</h3><div class="calc-grid"><label>🔨 المصنعية<input id="rLabor" type="number" min="0" step=".01" value="0"></label><label>🔧 قطع الغيار<input id="rPartsTotal" type="number" readonly value="0"></label><label>💰 الإجمالي<input id="rTotal" type="number" readonly value="0"></label><label>💵 العربون <small>اختياري</small><input id="rDeposit" type="number" min="0" step=".01" value="0"></label><label id="remainBox" class="hidden">🧾 المتبقي<input id="rRemain" type="number" readonly value="0"></label></div></section>
<section class="parts-box"><h3>🔧 قطع الغيار المستخدمة</h3><div class="part-add"><select id="rPart"></select><input id="rPartQty" type="number" min="1" value="1"><button type="button" class="secondary" onclick="addPartToOrder()">➕ إضافة</button></div><div id="orderParts"></div></section>
<section id="quickCustomerBox" class="quick-add hidden"><h3>➕ إضافة عميل سريع</h3><div class="form-grid"><label>اسم العميل<input id="qcName"></label><label>التليفون<input id="qcPhone" inputmode="tel"></label><label>المركز<select id="qcCenter"></select></label><label>القرية<select id="qcVillage"></select></label><label>الشارع / علامة مميزة <small>اختياري</small><input id="qcStreet"></label></div><div class="actions"><button type="button" class="primary" onclick="saveQuickCustomer()">💾 حفظ العميل واختياره</button><button type="button" class="secondary" onclick="toggle('quickCustomerBox')">إلغاء</button></div></section>
<section id="quickDeviceBox" class="quick-add hidden"><h3>➕ إضافة جهاز سريع</h3><div class="form-grid"><label>نوع الجهاز<select id="qdType"></select></label><label>التصنيف<select id="qdCategory"></select></label><label>الماركة<select id="qdBrand"></select></label><label>الموديل<input id="qdModel"></label><label class="wide">وصف الجهاز<textarea id="qdDesc"></textarea></label></div><div class="actions"><button type="button" class="primary" onclick="saveQuickDevice()">💾 حفظ الجهاز واختياره</button><button type="button" class="secondary" onclick="toggle('quickDeviceBox')">إلغاء</button></div></section>
<div class="actions"><button class="primary">💾 حفظ وفتح أمر الشغل 360°</button><button type="button" class="secondary" onclick="toggle('requestForm')">إلغاء</button></div></form>
<div id="requestSchedule" class="schedule-panel"></div>
<div class="filters"><input id="requestSearch" class="search" placeholder="🔍 بحث"><select id="statusFilter"><option value="">كل الحالات</option><option>جديد</option><option>تم التواصل</option><option>مجدول</option><option>جاري الفحص</option><option>انتظار موافقة العميل</option><option>تحت الإصلاح</option><option>مكتمل</option><option>ملغي</option></select><select id="workshopFilter"><option value="">كل أوامر الشغل</option><option value="workshop">🏭 أوامر الورشة</option><option value="pull">📦 أجهزة مسحوبة / في طريقها للورشة</option><option value="inside">🔧 أجهزة داخل الورشة</option></select></div><div id="requestList"></div></main><script src="app.js"></script><script src="workshop-mini-enhancements.js"></script></body></html>
