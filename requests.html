<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الصيانة</title><link rel="stylesheet" href="style.css"></head><body><main class="page">
<a class="back" href="index.html">← الرئيسية</a><div class="page-head"><h1>طلبات الصيانة</h1><a class="btn small" href="#requestForm">+ طلب جديد</a></div>
<form id="requestForm" class="form"><input type="hidden" id="requestId">
<label>العميل<select id="requestCustomer" required></select></label><label>الجهاز<select id="requestDevice" required></select></label>
<label>وصف العطل<textarea id="fault" required></textarea></label>
<label>الأولوية<select id="priority"><option>عادية</option><option>عاجلة</option><option>أولوية عالية</option></select></label>
<label>موعد الزيارة<input id="visitDate" type="datetime-local"></label>
<label>الحالة<select id="requestStatus"><option>جديد</option><option>تم التواصل</option><option>مجدول</option><option>جاري الفحص</option><option>انتظار موافقة العميل</option><option>تحت الإصلاح</option><option>مكتمل</option><option>ملغي</option></select></label>
<label>نتيجة الكشف / الأعمال المنفذة<textarea id="inspection"></textarea></label>
<label>التكلفة الإجمالية<input id="total" type="number" min="0" step="0.01"></label>
<label>المدفوع<input id="paid" type="number" min="0" step="0.01"></label>
<label>تاريخ نهاية الضمان<input id="warrantyEnd" type="date"></label>
<p class="hint">التاريخ هو موعد نهاية الضمان ويُستخدم كتذكير. الكشف المبدئي ليس فاتورة قانونية.</p>
<div class="actions"><button type="submit">حفظ وفتح ملف الطلب 360°</button><button type="button" class="secondary hidden" id="cancelRequestEdit">إلغاء التعديل</button></div></form>
<section><h2>طلبات الصيانة</h2><div class="filters"><input id="requestSearch" placeholder="بحث بالعميل أو رقم الطلب"><select id="statusFilter"><option value="">كل الحالات</option><option>جديد</option><option>تم التواصل</option><option>مجدول</option><option>جاري الفحص</option><option>انتظار موافقة العميل</option><option>تحت الإصلاح</option><option>مكتمل</option><option>ملغي</option></select></div><div id="requestList"></div></section>
</main><script src="app.js"></script></body></html>
