<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأجهزة</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a><div class="head"><h1>الأجهزة</h1><a class="btn" href="#deviceForm">+ جهاز جديد</a></div>
<form id="deviceForm" class="form"><input id="deviceId" type="hidden"><label>العميل<select id="deviceCustomer" required></select></label><label>العنوان المرتبط بالجهاز<select id="deviceAddress" required></select></label><div class="grid2"><label>نوع الجهاز<select id="deviceType" required><option value="">اختر</option><option>ثلاجة</option><option>فريزر</option><option>غسالة أوتوماتيك</option><option>غسالة فوق أوتوماتيك</option><option>غسالة نصف أوتوماتيك</option><option>تكييف</option><option>سخان مياه</option><option>كولدير</option><option>سخان غاز</option><option>أخرى</option></select></label><label>الماركة<input id="deviceBrand" required></label></div><div class="grid2"><label>الموديل<input id="deviceModel"></label><label>وصف الجهاز<input id="deviceDescription"></label></div><label>صور الجهاز<input id="devicePhoto" type="file" accept="image/*"></label><div id="photoPreview"></div>
<div class="actions"><button>حفظ وفتح ملف الجهاز 360°</button><button type="button" class="secondary hidden" id="cancelDevice">إلغاء التعديل</button></div></form><div class="filters"><input id="deviceSearch" placeholder="بحث بالعميل أو النوع أو الماركة"><select id="deviceFilter"><option value="">كل الأجهزة</option></select></div><div id="deviceList"></div></main><script src="app.js"></script></body></html>
