<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المخزن</title><link rel="stylesheet" href="style.css"></head><body><main class="page">
<a class="back" href="index.html">← الرئيسية</a><div class="page-head"><h1>المخزن</h1><a class="btn small" href="#partForm">+ قطعة جديدة</a></div>
<form id="partForm" class="form"><input type="hidden" id="partId"><label>اسم القطعة<input id="partName" required></label><label>كود القطعة<input id="partCode"></label><label>التصنيف<input id="partCategory"></label><label>الكمية الحالية<input id="partQty" type="number" min="0" step="1" required></label><label>الحد الأدنى للمخزون<input id="partMin" type="number" min="0" step="1"></label><label>سعر الشراء<input id="partBuy" type="number" min="0" step="0.01"></label><label>سعر الاستخدام<input id="partUse" type="number" min="0" step="0.01"></label>
<div class="actions"><button type="submit">حفظ وفتح ملف القطعة 360°</button><button type="button" class="secondary hidden" id="cancelPartEdit">إلغاء التعديل</button></div></form>
<section><h2>قطع الغيار</h2><input id="partSearch" placeholder="بحث بالاسم أو الكود"><div id="partList"></div></section>
</main><script src="app.js"></script></body></html>
