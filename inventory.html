<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المخزن</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a><div class="head"><h1>المخزن</h1><a class="btn" href="#partForm">+ قطعة غيار</a></div><form id="partForm" class="form"><input id="partId" type="hidden"><label>اسم القطعة<input id="partName" required></label><div class="grid2"><label>الكود<input id="partCode"></label><label>التصنيف<input id="partCategory"></label></div><div class="grid2"><label>الكمية الحالية<input id="partQty" type="number" min="0" step="1" required></label><label>الحد الأدنى<input id="partMin" type="number" min="0" step="1"></label></div><div class="grid2"><label>سعر الشراء<input id="partBuy" type="number" min="0" step=".01"></label><label>سعر الاستخدام<input id="partUse" type="number" min="0" step=".01"></label></div><label>صورة القطعة<input id="partPhoto" type="file" accept="image/*"></label><div id="partPhotoPreview"></div><div class="actions"><button>حفظ وفتح ملف القطعة 360°</button><button type="button" class="secondary hidden" id="cancelPart">إلغاء التعديل</button></div></form><div class="filters"><input id="partSearch" placeholder="بحث بالاسم أو الكود أو التصنيف"><select id="stockFilter"><option value="">كل المخزون</option><option value="low">الحد الأدنى أو أقل</option><option value="out">نافد</option></select></div><div id="partList"></div></main><script src="app.js"></script></body></html>
