<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001b4d"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png"><link rel="apple-touch-icon" href="icon-192-v2.png"><title>الأجهزة</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a>
<div class="page-head"><h1>🔧 الأجهزة</h1><div class="section-actions"><a class="icon-btn small-btn" href="settings.html#device-types">⚙️ الأنواع</a><a class="icon-btn small-btn" href="settings.html#brands">🏷️ الماركات</a><button class="danger-btn small-btn" type="button" onclick="deleteAllDevices()">🗑️ حذف عام</button><button class="primary small-btn" onclick="toggle('deviceForm')">➕ جهاز جديد</button></div></div>
<form id="deviceForm" class="form hidden"><div class="form-grid"><label>العميل<div class="select-add"><select id="dCustomer" required></select><button type="button" class="secondary mini-action" onclick="toggle('quickDeviceCustomerBox')">➕ عميل</button></div></label><label>العنوان<select id="dAddress" required></select></label><label>نوع الجهاز<select id="dType" required></select></label><label>التصنيف<select id="dCategory" required></select></label><label>الماركة<select id="dBrand" required></select></label><label>الموديل<input id="dModel"></label><label>وصف الجهاز<textarea id="dDesc"></textarea></label><label>صورة الجهاز<input id="dPhoto" type="file" accept="image/*"></label></div><div id="photoPreview"></div><div class="actions"><button class="primary">💾 حفظ وفتح ملف الجهاز 360°</button><button type="button" class="secondary" onclick="toggle('deviceForm')">إلغاء</button></div></form>
<section id="quickDeviceCustomerBox" class="quick-add hidden"><h3>➕ إضافة عميل سريع</h3><div class="form-grid"><label>اسم العميل<input id="dcName"></label><label>التليفون<input id="dcPhone" inputmode="tel"></label><label>المركز<select id="dcCenter"></select></label><label>القرية<select id="dcVillage"></select></label><label>الشارع / علامة مميزة <small>اختياري</small><input id="dcStreet"></label></div><div class="actions"><button type="button" class="primary" onclick="saveDeviceCustomer()">💾 حفظ العميل واختياره</button><button type="button" class="secondary" onclick="toggle('quickDeviceCustomerBox')">إلغاء</button></div></section><input id="deviceSearch" class="search" placeholder="🔍 بحث بالعميل أو النوع أو الماركة أو الموديل"><div id="deviceList"></div></main><script src="app.js"></script><script src="workshop-mini-enhancements.js"></script></body></html>
