<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العملاء</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a>
<div class="page-head"><h1>👤 العملاء</h1><div class="section-actions"><a class="icon-btn small-btn" href="settings.html#locations">⚙️ المناطق</a><button class="primary small-btn" onclick="toggle('customerForm')">➕ عميل جديد</button></div></div>
<form id="customerForm" class="form hidden"><div class="form-grid">
<label>اسم العميل<input id="cName" required></label><label>التليفون<input id="cPhone" required inputmode="tel"></label>
</div><h3>📍 العنوان الأساسي</h3><div class="address-note">المركز + القرية هما العنوان الأساسي، والشارع أو العلامة المميزة اختيارية.</div><div class="form-grid"><label>المركز<select id="cCenter" required></select></label><label>القرية<select id="cVillage" required></select></label><label>الشارع / علامة مميزة <small>اختياري</small><input id="cStreet"></label></div><h3>📍 عنوان إضافي <small>اختياري</small></h3><div class="form-grid"><label>المركز<select id="aCenter"></select></label><label>القرية<select id="aVillage"></select></label><label>الشارع / علامة مميزة <small>اختياري</small><input id="aStreet"></label></div>
<div class="actions"><button class="primary">💾 حفظ وفتح ملف العميل 360°</button><button type="button" class="secondary" onclick="toggle('customerForm')">إلغاء</button></div></form>
<input id="customerSearch" class="search" placeholder="🔍 بحث بالاسم أو التليفون"><div id="customerList"></div></main><script src="app.js"></script></body></html>
