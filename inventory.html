<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المخزن</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a>
<div class="page-head"><h1>📦 المخزن</h1><button class="primary" onclick="toggle('partForm')">➕ قطعة جديدة</button></div>
<form id="partForm" class="form hidden"><div class="form-grid"><label>اسم القطعة<input id="pName" required></label><label>الكود<input id="pCode"></label><label>التصنيف<select id="pCategory" required></select></label><label>مكانها في المخزن<input id="pLocation" placeholder="رف / درج / دولاب"></label><label>الكمية<input id="pQty" type="number" min="0" required></label><label>الحد الأدنى<input id="pMin" type="number" min="0" value="0"></label><label>سعر الشراء<input id="pBuy" type="number" min="0" step=".01"></label><label>سعر الاستخدام<input id="pUse" type="number" min="0" step=".01"></label><label>صورة القطعة<input id="pPhoto" type="file" accept="image/*"></label></div><div id="partPhotoPreview"></div><div class="actions"><button class="primary">💾 حفظ وفتح ملف القطعة 360°</button><button type="button" class="secondary" onclick="toggle('partForm')">إلغاء</button></div></form>
<input id="partSearch" class="search" placeholder="🔍 بحث بالاسم أو الكود أو المكان"><div id="partList"></div></main><script src="app.js"></script></body></html>
