<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الصيانة</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a><div class="head"><h1>طلبات الصيانة</h1><a class="btn" href="#requestForm">+ طلب جديد</a></div>
<form id="requestForm" class="form"><input id="requestId" type="hidden"><label>العميل<select id="requestCustomer" required></select></label><label>الجهاز<select id="requestDevice" required></select></label><label>العنوان<select id="requestAddress" required></select></label><label>وصف العطل<textarea id="fault" required></textarea></label>
<div class="grid2"><label>الأولوية<select id="priority"><option>عادية</option><option>عاجلة</option><option>أولوية عالية</option></select></label><label>موعد الزيارة<input id="visitDate" type="datetime-local"></label></div>
<label>الحالة<select id="status"><option>جديد</option><option>تم التواصل</option><option>مجدول</option><option>جاري الفحص</option><option>انتظار موافقة العميل</option><option>تحت الإصلاح</option><option>مكتمل</option><option>ملغي</option></select></label>
<label>نتيجة الكشف / الأعمال المنفذة<textarea id="inspection"></textarea></label>
<div class="grid2"><label>رسوم الزيارة / الكشف<input id="visitFee" type="number" min="0" step=".01"></label><label>إجمالي الإصلاح<input id="repairTotal" type="number" min="0" step=".01"></label></div>
<div class="grid2"><label>المدفوع<input id="paid" type="number" min="0" step=".01"></label><label>تاريخ نهاية الضمان<input id="warrantyEnd" type="date"></label></div>
<div class="sectionbox"><h3>قطع الغيار المستخدمة</h3><p class="hint">اختيار القطعة من المخزن يربطها بالطلب ويخصم الكمية عند الحفظ.</p><div id="requestParts"></div><button type="button" class="secondary" id="addRequestPart">+ إضافة قطعة غيار</button></div><label><input id="legalInvoice" type="checkbox"> تم إصدار الفاتورة القانونية النهائية</label>
<p class="hint">التنبيه/التقدير المبدئي ليس فاتورة قانونية. الفاتورة النهائية بعد اكتمال الطلب، وهي التي يُعتد بها عند الحاجة لتفعيل الضمان.</p>
<div class="actions"><button>حفظ وفتح ملف الطلب 360°</button><button type="button" class="secondary hidden" id="cancelRequest">إلغاء التعديل</button></div></form>
<div class="filters"><input id="requestSearch" placeholder="بحث برقم الطلب أو العميل أو العطل"><select id="statusFilter"><option value="">كل الحالات</option><option>جديد</option><option>تم التواصل</option><option>مجدول</option><option>جاري الفحص</option><option>انتظار موافقة العميل</option><option>تحت الإصلاح</option><option>مكتمل</option><option>ملغي</option></select><select id="priorityFilter"><option value="">كل الأولويات</option><option>عادية</option><option>عاجلة</option><option>أولوية عالية</option></select></div><div id="requestList"></div></main><script src="app.js"></script></body></html>
