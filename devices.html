<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأجهزة</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><a class="back" href="index.html">← الرئيسية</a>
<div class="page-head"><h1>🔧 الأجهزة</h1><button class="primary" onclick="toggle('deviceForm')">➕ جهاز جديد</button></div>
<form id="deviceForm" class="form hidden"><div class="form-grid"><label>العميل<select id="dCustomer" required></select></label><label>العنوان<select id="dAddress" required></select></label><label>نوع الجهاز<select id="dType" required></select></label><label>التصنيف<select id="dCategory" required></select></label><label>الماركة<select id="dBrand" required></select></label><label>الموديل<input id="dModel"></label><label>وصف الجهاز<textarea id="dDesc"></textarea></label><label>صورة الجهاز<input id="dPhoto" type="file" accept="image/*"></label></div><div id="photoPreview"></div><div class="actions"><button class="primary">💾 حفظ وفتح ملف الجهاز 360°</button><button type="button" class="secondary" onclick="toggle('deviceForm')">إلغاء</button></div></form>
<input id="deviceSearch" class="search" placeholder="🔍 بحث بالعميل أو النوع أو الماركة"><div id="deviceList"></div></main><script src="app.js"></script></body></html>
